  <script>
    (function () {
      var root = document.documentElement;
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
      } catch (e) { /* storage bloqueado: segue o tema do sistema */ }
    })();
  </script>

  <style>
    @font-face {
      font-family: "Geist";
      src: url("assets/fonts/geist-latin-wght-normal.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light dark;
      --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --r-pill: 999px;
      --r-lg: 20px;
      --ease: cubic-bezier(.16, 1, .3, 1);

      --bg: #f3f5f7;
      --surface: #fafbfc;
      --line: rgba(13, 20, 27, .10);
      --line-strong: rgba(13, 20, 27, .20);
      --text: #0d141b;
      --text-2: #434f5c;
      --accent: #167a5e;
      --on-accent: #f3faf7;
      --shadow: 0 18px 40px -24px rgba(16, 70, 56, .35);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0f14;
        --surface: #141c25;
        --line: rgba(232, 237, 242, .10);
        --line-strong: rgba(232, 237, 242, .20);
        --text: #e8edf2;
        --text-2: #a7b2bd;
        --accent: #43d1a0;
        --on-accent: #05130d;
        --shadow: 0 18px 40px -24px rgba(0, 0, 0, .7);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0f14;
      --surface: #141c25;
      --line: rgba(232, 237, 242, .10);
      --line-strong: rgba(232, 237, 242, .20);
      --text: #e8edf2;
      --text-2: #a7b2bd;
      --accent: #43d1a0;
      --on-accent: #05130d;
      --shadow: 0 18px 40px -24px rgba(0, 0, 0, .7);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: clamp(28px, 8vh, 72px) 20px 40px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 18px 0 2px;
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    p.sub {
      margin: 0 0 28px;
      color: var(--text-2);
      font-size: .95rem;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border-radius: var(--r-lg);
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-weight: 560;
      font-size: 1rem;
      transition: transform .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--line-strong);
    }
    .link--primary {
      background: var(--accent);
      color: var(--on-accent);
      border-color: transparent;
      box-shadow: var(--shadow);
    }
    .link .ico {
      width: 22px;
      height: 22px;
      flex: none;
    }
    .link span { margin: 0 auto; }

    .social {
      display: flex;
      gap: 18px;
      margin-top: 30px;
    }
    .social a {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--text-2);
      transition: color .2s var(--ease), border-color .2s var(--ease);
    }
    .social a:hover { color: var(--text); border-color: var(--line-strong); }
    .social svg { width: 20px; height: 20px; }

    footer {
      margin-top: 36px;
      font-size: .8rem;
      color: var(--text-2);
    }
    footer a { color: inherit; }
  </style>
</head>
